    function AdminPusatUnduhan({ ctx, showToast }) {
      const { profil, teachers, allStudents, mapelList, ekskulList, kkmConfig, temaConfig, appConfig, studentGrades, materiGuru, absensi, ekskulData, kokuData, dimensiTarget, guruProfil, guruMapelConfig } = ctx;
      const ts = new Date().toISOString().slice(0,10);
      const sekolah = (profil.namaSekolah || 'sekolah').replace(/\s+/g,'_');

      const downloadJSON = (name, data) => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        showToast(`${name} berhasil diunduh!`);
      };

      const exportTeachersCSV = () => {
        const rows = [['No','Nama Guru','NIP','Wali Kelas','Mapel','Username','Keterangan']];
        teachers.forEach((t,i) => rows.push([i+1, t.nama, t.nip, t.waliKelas, t.mapel, t.username, t.ket||'Aktif']));
        downloadXLSXFile(`guru_${sekolah}_${ts}.xlsx`, rows, 'Data Guru');
      };
      const exportSiswaCSV = () => {
        const rows = [['No','Nama','NISN','NIS','Rombel','TTL','JK','Agama','Ayah','Ibu','Pek.Ayah','Pek.Ibu','Dusun','Desa','Kec','Kab']];
        allStudents.forEach((s,i) => {
          const a = s.alamat || {};
          rows.push([i+1, s.nama, s.nisn, s.nis, s.rombelSD, s.tempatTanggalLahir, s.jenisKelamin, s.agama, s.namaAyah, s.namaIbu, s.pekerjaanAyah, s.pekerjaanIbu, a.jalan||'', a.desa||'', a.kecamatan||'', a.kabupaten||'']);
        });
        downloadXLSXFile(`siswa_${sekolah}_${ts}.xlsx`, rows, 'Data Siswa');
      };

          });
        });
        downloadXLSXFile(`nilai_${sekolah}_${ts}.xlsx`, rows, 'Rekap Nilai');

    function AdminProgressGuru({ teachers, students, mapelList, studentGrades, materiGuru, calculateNA }) {
      return (
        <div className="bg-white/90 backdrop-blur-sm p-6 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm max-w-5xl">
          <div className="flex items-center gap-3 sm:gap-4 mb-6 sm:mb-8">

             <div>

                <p className="text-slate-500 font-medium text-[10px] sm:text-sm">Lihat sejauh mana Wali Kelas telah mengisi nilai (Berdasarkan total Siswa & Mapel).</p>
             </div>
          </div>
          <div className="w-full overflow-x-auto border border-slate-200 rounded-xl sm:rounded-2xl">
            <table className="w-full text-left text-[9px] sm:text-sm table-fixed break-words min-w-[500px]">
              <thead className="bg-slate-50 border-b border-slate-200 text-slate-600">
                <tr>
                  <th className="p-2 sm:px-4 sm:py-3 border-r w-[25%]">Nama Guru</th>
                  <th className="p-2 sm:px-4 sm:py-3 border-r text-center w-[15%]">Wali Kelas</th>
                  <th className="p-2 sm:px-4 sm:py-3 border-r text-center w-[15%]">Jml Siswa</th>
                  <th className="p-2 sm:px-4 sm:py-3 border-r text-center w-[20%]">Nilai Terisi</th>
                  <th className="p-2 sm:px-4 sm:py-3 text-center w-[25%]">Progress</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {teachers.length === 0 ? <tr><td colSpan="5" className="p-8 text-center text-slate-400 font-bold">Data Guru Masih Kosong.</td></tr> : teachers.map((t, idx) => {
                   const classStudents = students.filter(s => s.rombelSD === t.waliKelas);
                   let totalExpected = mapelList.length * classStudents.length;
                   let totalFilled = 0;
                   
                   if (totalExpected > 0) {
                      mapelList.forEach(m => {
                         classStudents.forEach(s => {
                            // Hitung dengan class/rombel spesifik
                            if (calculateNA(m, s.id, t.waliKelas, materiGuru, studentGrades) !== null) {
                               totalFilled++;
                            }
                         });
                      });
                   }
                   const progress = totalExpected === 0 ? 0 : Math.round((totalFilled / totalExpected) * 100);
                   
                   // PENENTUAN WARNA BERDASARKAN PROGRESS
                   const bgClass = progress < 50 ? 'bg-red-50' : (progress <= 70 ? 'bg-amber-50' : 'bg-emerald-50');
                   const barClass = progress < 50 ? 'bg-red-500' : (progress <= 70 ? 'bg-amber-500' : 'bg-emerald-500');
                   const textClass = progress < 50 ? 'text-red-700' : (progress <= 70 ? 'text-amber-700' : 'text-emerald-700');

                   return (
                     <tr key={t.id || idx} className={`transition-colors ${bgClass}`}>
                       <td className="p-2 sm:px-4 sm:py-3 font-bold text-slate-800 border-r">{t.nama}</td>
                       <td className="p-2 sm:px-4 sm:py-3 text-primary font-black text-center border-r">{t.waliKelas}</td>
                       <td className="p-2 sm:px-4 sm:py-3 text-slate-600 font-bold text-center border-r">{classStudents.length}</td>
                       <td className="p-2 sm:px-4 sm:py-3 text-slate-700 font-bold text-center border-r">{totalFilled}/{totalExpected}</td>
                       <td className="p-2 sm:px-4 sm:py-3 px-2">
                         <div className="w-full bg-white rounded-full h-2 sm:h-3.5 mb-1 border border-slate-200">
                           <div className={`h-full rounded-full transition-all duration-500 ${barClass}`} style={{width: `${progress}%`}}></div>
                         </div>
                         <span className={`text-[9px] sm:text-xs font-bold block text-center ${textClass}`}>{progress}% Selesai</span>
                       </td>
                     </tr>
                   )
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

                   count++;
                }

             return { ...s, total, avg, count };

    function GuruInputNilai({ mapelList, materiGuru, studentGrades, setStudentGrades, students, calculateNA, profil, showToast, showConfirm, isAppLocked, appConfig, selectedRombel, kkmConfig }) {
      const [selectedMapel, setSelectedMapel] = useState(mapelList[0] || '');
      const [expandedRowId, setExpandedRowId] = useState(null);

      const grades = studentGrades[selectedMapel] || {};
      const currentMateriKey = selectedRombel && selectedMapel ? `${selectedRombel}_${selectedMapel}` : null;
      const currentMateri = (materiGuru[currentMateriKey] || []).filter(m => m !== '');

      const handleChange = (studentId, field, val) => {
        if(isAppLocked) return;
        const valFloat = val === '' ? undefined : parseFloat(val);
        setStudentGrades(prev => ({
          ...prev, 
          [selectedMapel]: {
            ...(prev[selectedMapel] || {}),
            [studentId]: { ...((prev[selectedMapel] || {})[studentId] || {}), [field]: valFloat }
          }
        }));
      };

      const handleSave = () => {
        syncToCloud('studentGrades', studentGrades, profil.tahunAjaran);
        showToast(`Semua Nilai Akademik Mapel ${selectedMapel} Disimpan!`);
      };

      const handleReset = () => {
        if(isAppLocked) return;
        showConfirm(`PERINGATAN! Yakin ingin KOSONGKAN/HAPUS seluruh nilai siswa pada mata pelajaran ${selectedMapel}? Data tidak dapat dikembalikan.`, () => {
          setStudentGrades(prev => {
            const updated = { ...prev };
            delete updated[selectedMapel];
            syncToCloud('studentGrades', updated, profil.tahunAjaran);
            return updated;
          });
          showToast(`Data Nilai ${selectedMapel} Berhasil Dihapus!`);
        });
      };

      // Helper kriteria mengikuti pengaturan KKM Admin
      const getKriteriaLabelLocal = (nilai) => {
        const defaultKriteria = [
          { min: 0,  max: 69,  label: 'Perlu Bimbingan' },
          { min: 70, max: 79,  label: 'Cukup' },
          { min: 80, max: 89,  label: 'Baik' },
          { min: 90, max: 100, label: 'Sangat Baik' }
        ];
        const kriteria = (kkmConfig && kkmConfig.kriteria && kkmConfig.kriteria.length >= 1) ? kkmConfig.kriteria : defaultKriteria;
        const n = Number(nilai);
        const found = kriteria.find(k => n >= Number(k.min) && n <= Number(k.max));
        if (found) return found.label;
        const sorted = [...kriteria].sort((a, b) => Number(a.min) - Number(b.min));
        if (n < Number(sorted[0].min)) return sorted[0].label;
        return sorted[sorted.length - 1].label;
      };

      const generateKeterangan = (s, studentGradesLocal) => {
        if (!studentGradesLocal || currentMateri.length === 0) return '';
        const kkmVal = (kkmConfig && kkmConfig.kkm) ? Number(kkmConfig.kkm) : 70;
        let maxVal = -1, minVal = 101, maxIdx = -1, minIdx = -1, countMateri = 0;
        currentMateri.forEach((_, idx) => {
          const val = studentGradesLocal[`m${idx}`];
          if (val !== undefined && val !== null && !isNaN(val) && Number(val) > 0) {
            const nv = Number(val);
            if (nv > maxVal) { maxVal = nv; maxIdx = idx; }
            if (nv < minVal) { minVal = nv; minIdx = idx; }
            countMateri++;
          }
        });
        if (countMateri === 0) return '-';

        const properName = (typeof toProperCase === 'function') ? toProperCase(s.nama) : s.nama;
        const labelMax = getKriteriaLabelLocal(maxVal);
        let ket = `Ananda ${properName} menunjukkan hasil yang ${labelMax} dalam ${currentMateri[maxIdx]}`;
        // Hanya tampilkan baris "Perlu Bimbingan" / dst. jika nilai terendah benar-benar di bawah KKM admin
        if (currentMateri.length > 1 && maxIdx !== minIdx && minVal < kkmVal) {
            const labelMin = getKriteriaLabelLocal(minVal);
            ket += `\n${labelMin} dalam ${currentMateri[minIdx]}`;
        }
        return ket;
      };

      return (
        <div className="bg-white/90 backdrop-blur-sm p-4 sm:p-8 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col h-full">
          {isAppLocked && <AppLockBanner appConfig={appConfig} />}
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 sm:mb-6 gap-3 sm:gap-4 border-b border-slate-100 pb-4">
            <div>
              <h2 className="font-extrabold text-lg sm:text-2xl text-slate-800">Input Nilai Formatif & Sumatif</h2>
              <p className="text-slate-500 font-medium text-[10px] sm:text-sm mt-1">Gunakan mode lanskap atau tutup menu samping di HP.</p>
            </div>

    function GuruInputKoku({ students, kokuData, setKokuData, dimensiTarget, setDimensiTarget, profil, showToast, showConfirm, isAppLocked, appConfig }) {
      const [expandedRowId, setExpandedRowId] = useState(null);

      const handleUpdate = (id, field, val) => {
        if(isAppLocked) return;
        setKokuData(p => ({...p, [id]: {...(p[id]||{}), [field]: val}}));
      };
      const handleDimensiChange = (index, value) => {
        if(isAppLocked) return;
        const newDimensi = [...dimensiTarget]; newDimensi[index] = value; setDimensiTarget(newDimensi);
      };

      const handleSave = () => {
        syncToCloud('kokuData', kokuData, profil.tahunAjaran);
        syncToCloud('dimensiTarget', dimensiTarget, profil.tahunAjaran);
        showToast('Penilaian P5 disimpan!');
      };

      const handleReset = () => {
        if(isAppLocked) return;
        showConfirm('Yakin ingin KOSONGKAN seluruh data Penilaian Kokurikuler (P5)?', () => {
          setKokuData({});
          syncToCloud('kokuData', {}, profil.tahunAjaran);
          showToast('Data Kokurikuler berhasil dihapus!');
        });
      };

      const generateKokuText = (row, sName, sharedTema) => {
         const labelOf = (v) => {
           if (v === '3' || v === 'A') return 'Mahir';
           if (v === '2' || v === 'B') return 'Cakap';
           return 'Berkembang';
         };
         const dims = [
           { name: dimensiTarget[0], val: row.d1 },
           { name: dimensiTarget[1], val: row.d2 },
           { name: dimensiTarget[2], val: row.d3 },
         ];
         const groups = { Mahir: [], Cakap: [], Berkembang: [] };
         dims.forEach(d => groups[labelOf(d.val)].push(d.name));
         const tema = sharedTema && String(sharedTema).trim() !== '' ? String(sharedTema).trim() : '(Belum diisi)';
         const parts = [];
         if (groups.Mahir.length) parts.push(`telah Mahir dan menjadi contoh dalam ${groups.Mahir.join(', ')}`);
         if (groups.Cakap.length) parts.push(`sudah Cakap menerapkan secara mandiri pada ${groups.Cakap.join(', ')}`);
         if (groups.Berkembang.length) parts.push(`masih pada tahap Berkembang dan membutuhkan bimbingan pada ${groups.Berkembang.join(', ')}`);
         return `Ananda ${toProperCase(sName)} telah menyelesaikan kegiatan kokurikuler dengan tema "${tema}". Ananda ${parts.join('; ')}.`;
      };

      return (
        <div className="bg-white/90 backdrop-blur-sm p-4 sm:p-8 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col h-full">
          {isAppLocked && <AppLockBanner appConfig={appConfig} />}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-8 border-b border-slate-100 pb-4 sm:pb-6 gap-3 sm:gap-4">
            <h2 className="font-extrabold text-lg sm:text-2xl text-slate-800">Penilaian Kokurikuler (P5)</h2>
            <div className="flex gap-2 w-full sm:w-auto">
               <button onClick={handleReset} disabled={isAppLocked} className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 sm:px-4 sm:py-3 rounded-xl sm:rounded-2xl font-bold flex items-center justify-center disabled:opacity-50"><Trash2 /></button>
               <button onClick={handleSave} disabled={isAppLocked} className="flex-1 sm:flex-none justify-center bg-primary text-white px-4 py-2 sm:px-6 sm:py-3 rounded-xl sm:rounded-2xl text-xs sm:text-base font-bold flex items-center gap-2 shadow-md disabled:opacity-50"><Save /> Simpan P5</button>
            </div>
          </div>

          {students.length === 0 ? <p className="font-bold text-red-500 text-xs sm:text-base">Silahkan pilih / kunci Rombel Kelas terlebih dahulu di menu "Pilih / Tarik Siswa".</p> : (
            <>
            <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl mb-4">
              <label className="block text-xs sm:text-sm font-extrabold text-amber-800 mb-2">TEMA KOKURIKULER (1 Kelas — Sama Untuk Semua Siswa)</label>
              <input type="text" disabled={isAppLocked} className="w-full p-3 border border-amber-300 rounded-xl text-sm font-bold outline-none focus:border-amber-500 bg-white disabled:opacity-50" placeholder="Contoh: Gaya Hidup Berkelanjutan" value={(kokuData.__tema)||''} onChange={e=>setKokuData(p=>({...p, __tema: e.target.value}))} data-testid="koku-tema-shared" />
              <p className="text-[10px] text-amber-700 mt-2 italic">Skala penilaian: <b>1 = Berkembang</b> (perlu bimbingan), <b>2 = Cakap</b> (mandiri), <b>3 = Mahir</b> (jadi contoh).</p>
            </div>
            <div className="w-full border border-slate-200 rounded-xl sm:rounded-2xl pb-1 table-container overflow-x-auto relative">

    const MAPEL_ABBR_MAP = {
      'pendidikan agama islam dan budi pekerti': 'PAI',

      'pendidikan agama islam': 'PAI',

      'pendidikan jasmani olahraga dan kesehatan': 'PJOK',
      'pendidikan jasmani, olahraga dan kesehatan': 'PJOK',
      'pjok': 'PJOK',
      'bahasa inggris': 'ENGLISH',
      'seni musik': 'SM',

      'btq': 'BTQ',
      'tahfizh': 'THFZ',
      'tahfidz': 'THFZ',
    };
    function getMapelAbbr(name) {
      if (!name) return '';
      const key = String(name).toLowerCase().trim().replace(/\s+/g, ' ');
      if (MAPEL_ABBR_MAP[key]) return MAPEL_ABBR_MAP[key];
      // Cek inklusi parsial
      for (const k in MAPEL_ABBR_MAP) {
        if (key.includes(k)) return MAPEL_ABBR_MAP[k];
      }
      // Fallback: ambil inisial huruf besar (skip kata sambung)
      const stop = new Set(['dan','atau','di','ke','yang','the','of','&']);
      const words = key.split(/[\s\-_/]+/).filter(w => w && !stop.has(w));
      if (words.length === 1) return words[0].slice(0, 4).toUpperCase();
      return words.map(w => w[0]).join('').toUpperCase().slice(0, 5);
    }

    function GuruCetakRapor({ students, mapelList, teachers, calculateNA, getPredikat, profil, waliKelasName, kokuData, dimensiTarget, ekskulList, ekskulData, absensi, materiGuru, studentGrades, kkmConfig, temaConfig, showToast }) {
      const [selectedStudent, setSelectedStudent] = useState('ALL');

      const extractKecamatan = (kecString) => {
         if(!kecString) return '';

      };

      const fmtAbs = (val) => (!val || val === 0 || val === '0') ? '-' : `${val} hari`;

       const generateKokuTextPrint = (row, sName) => {
          // Skala baru: 3=Mahir, 2=Cakap, 1=Berkembang
          const lvl = (v) => {
            const n = Number(v);
            if (n === 3 || v === 'A') return 3;
            if (n === 2 || v === 'B') return 2;
            return 1;
          };
          const dims = [
            { name: dimensiTarget[0], n: lvl(row.d1) },
            { name: dimensiTarget[1], n: lvl(row.d2) },
            { name: dimensiTarget[2], n: lvl(row.d3) },
          ];
          const mahir = dims.filter(d => d.n === 3).map(d => d.name);
          const cakap = dims.filter(d => d.n === 2).map(d => d.name);
          const berkembang = dims.filter(d => d.n === 1).map(d => d.name);

          // Tema dari guru (shared satu kelas), default jika kosong
          const temaShared = (kokuData && kokuData.__tema) ? String(kokuData.__tema).trim() : '';
          const tema = temaShared || (row.tema && String(row.tema).trim() !== '' ? String(row.tema).trim() : 'Penguatan Profil Pelajar Pancasila');
          let text = `Ananda ${toProperCase(sName)} telah menyelesaikan kegiatan kokurikuler dengan tema "${tema}". `;

          const parts = [];
          if (mahir.length) parts.push(`telah mahir dan menjadi teladan dalam ${mahir.join(', ')}`);
          if (cakap.length) parts.push(`sudah cakap menerapkan ${cakap.join(', ')} secara mandiri`);
          if (berkembang.length) parts.push(`mulai berkembang dan masih membutuhkan bimbingan dalam ${berkembang.join(', ')}`);
          text += `Ananda ${parts.join(', serta ')}.`;
          return text;
       };

      const getStudentHTML = (s) => {
        let totalNa = 0;
        const properName = toProperCase(s.nama);
        let isLulusSemua = true;
        
        let numMatch = s.rombelSD ? s.rombelSD.match(/\d+/) : null;
        let kelasNum = numMatch ? parseInt(numMatch[0]) : 0;
        let fase = getFaseFromKelas(kelasNum);

        const currentTeacher = teachers.find(t => t.nama === waliKelasName);
        const waliNIP = currentTeacher && currentTeacher.nip && currentTeacher.nip !== '-' ? currentTeacher.nip : '';
        const kepsekNIP = profil.nip && profil.nip !== '-' ? profil.nip : '';

        // SOLUSI: Gabungkan mapel dari mapelList master admin DAN dari studentGrades
        // (untuk menangkap mapel yang ada nilainya tapi tidak terdaftar di master, atau urutan beda)
        const masterMapels = mapelList || [];
        const gradeMapels = Object.keys(studentGrades || {}).filter(m => {
          const scores = (studentGrades[m] || {})[s.id] || {};
          // Cek apakah ada nilai valid di mapel ini untuk siswa ini
          return Object.keys(scores).some(k => {
            const v = scores[k];
            return v !== undefined && v !== null && v !== '' && !isNaN(v) && Number(v) > 0;
          });
        });
        // Gabungkan dengan menjaga urutan master admin dulu, lalu mapel ekstra dari studentGrades
        const allMapels = [...masterMapels];
        gradeMapels.forEach(m => { if(!allMapels.includes(m)) allMapels.push(m); });
        // Filter hanya yang ada nilainya
        const validMapels = allMapels.filter(m => calculateNA(m, s.id, s.rombelSD) !== null);

        // Helper: ambil label kriteria dari kkmConfig.kriteria sesuai nilai
        const getKriteriaLabel = (nilai) => {
          const defaultKriteria = [
            { min: 0,  max: 69,  label: 'Perlu Bimbingan' },
            { min: 70, max: 79,  label: 'Cukup' },
            { min: 80, max: 89,  label: 'Baik' },

          ];
          const kriteria = (kkmConfig && kkmConfig.kriteria && kkmConfig.kriteria.length >= 1) ? kkmConfig.kriteria : defaultKriteria;
          const n = Number(nilai);
          // Cari kriteria yang range nya mencakup nilai
          const found = kriteria.find(k => n >= Number(k.min) && n <= Number(k.max));
          if (found) return found.label;
          // Fallback: ambil kriteria tertinggi jika nilai > max, atau terendah jika < min
          const sorted = [...kriteria].sort((a, b) => Number(a.min) - Number(b.min));
          if (n < Number(sorted[0].min)) return sorted[0].label;
          return sorted[sorted.length - 1].label;
        };

        const getKetMapel = (mapel, sId, rombelSD, sName) => {

          if(materi.length === 0) return `<p style="margin:0; padding-bottom: 4px;">${studentLabel}menunjukkan pemahaman yang baik terhadap seluruh tujuan pembelajaran.</p>`;

          let maxVal = -1, minVal = 101, maxIdx = -1, minIdx = -1;
          materi.forEach((_, idx) => {
            const val = scores[`m${idx}`];
            if (val !== undefined && val !== null && !isNaN(val) && Number(val) > 0) {

              if (nv > maxVal) { maxVal = nv; maxIdx = idx; }

          if (materi.length > 1 && maxIdx !== minIdx && minVal < kkmVal) {

             </div>

             <p style="font-size: 14px; font-weight: bold; margin-bottom: 10px; position: relative; z-index: 10;">NIS / NISN</p>
             <div style="border: 2px solid black; padding: 15px 40px; font-size: 20px; font-weight: bold; min-width: 400px; position: relative; z-index: 10; background-color: transparent;">
                ${fv(s.nis)} / ${fv(s.nisn)}
             </div>
          </div>

          <!-- SAMPUL 2 (IDENTITAS PESERTA DIDIK) -->
          <div style="padding: 15mm; font-family: 'Times New Roman', serif; font-size: 14px; position: relative; height: 100vh; box-sizing: border-box;">
             ${watermarkTag}
             <h2 style="text-align: center; font-style: italic; font-weight: bold; text-decoration: underline; margin-bottom: 30px; font-size: 16px; position: relative; z-index: 10;">IDENTITAS PESERTA DIDIK</h2>
             
             <table style="width: 100%; line-height: 2.2; position: relative; z-index: 10;">
                <tr><td style="width: 35%;">1. Nama Peserta Didik</td><td style="width: 2%;">:</td><td style="text-transform: uppercase;"><b>${fv(s.nama)}</b></td></tr>
                <tr><td>2. Nomor Induk / NISN</td><td>:</td><td>${fv(s.nis)} / ${fv(s.nisn)}</td></tr>
                <tr><td>3. Tempat, Tanggal Lahir</td><td>:</td><td style="text-transform: uppercase;">${fv(s.tempatTanggalLahir)}</td></tr>
                <tr><td>4. Jenis Kelamin</td><td>:</td><td>${fv(s.jenisKelamin)}</td></tr>
                <tr><td>5. Agama</td><td>:</td><td style="text-transform: uppercase;">${fv(s.agama)}</td></tr>
                <tr><td>6. Pendidikan Sebelumnya</td><td>:</td><td>${fv(s.pendidikanSebelumnya)}</td></tr>
                <tr><td style="vertical-align: top;">7. Alamat Peserta Didik</td><td style="vertical-align: top;">:</td><td style="text-transform: uppercase; line-height: 1.5; padding-top: 5px;">${fv(s.alamat?.jalan)}, ${fv(s.alamat?.desa)}, KEC. ${fv(s.alamat?.kecamatan)}, ${fv(s.alamat?.kabupaten)}</td></tr>
                <tr><td colspan="3" style="padding-top: 15px;">8. Nama Orang Tua</td></tr>
                <tr><td style="padding-left: 20px; font-weight: bold;">a. Ayah</td><td>:</td><td style="text-transform: uppercase;">${fv(s.namaAyah)}</td></tr>
                <tr><td style="padding-left: 20px; font-weight: bold;">b. Ibu</td><td>:</td><td style="text-transform: uppercase;">${fv(s.namaIbu)}</td></tr>
                <tr><td colspan="3" style="padding-top: 10px;">9. Pekerjaan Orang Tua</td></tr>
                <tr><td style="padding-left: 20px; font-weight: bold;">a. Ayah</td><td>:</td><td style="text-transform: uppercase;">${fv(s.pekerjaanAyah)}</td></tr>
                <tr><td style="padding-left: 20px; font-weight: bold;">b. Ibu</td><td>:</td><td style="text-transform: uppercase;">${fv(s.pekerjaanIbu)}</td></tr>
             </table>

             <div style="display: flex; justify-content: flex-end; align-items: flex-end; margin-top: 40px; padding-right: 20px; position: relative; z-index: 10;">
                <div style="width: 250px; text-align: center;">
                   <p style="margin-bottom: 5px; line-height: 1.2;">${cetakKecamatan}, ${profil.tanggalRaport}</p>
                   <p style="margin-bottom: 2.2cm; font-weight: bold; line-height: 1.2;">Kepala Sekolah</p>
                   <p style="font-weight: bold; text-decoration: underline; text-transform: uppercase; margin: 0; padding: 0; line-height: 1.2;">${profil.kepalaSekolah}</p>
                   ${profil.nip && profil.nip !== '-' ? `<p style="margin: 0; padding: 0; line-height: 1.2;">NIP. ${profil.nip}</p>` : ''}
                </div>
             </div>
          </div>
        `;
      };

      const handlePrint = () => {
        let toPrint = selectedStudent === 'ALL' ? students : students.filter(s => s.id.toString() === selectedStudent);
        if(toPrint.length === 0) { showToast('Siswa kosong, harap tarik/pilih Rombel terlebih dahulu'); return; }
        
        const combinedHTML = `
          <html><head>
            <title>Cetak Sampul</title>
            <style>
              @page { size: A4; margin: 0; }
              @media print { 
                 body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; margin: 0; } 
              }
            </style>
          </head><body style="margin: 0; padding: 0;">
            ${toPrint.map((s, idx) => `
               <div style="${idx !== toPrint.length - 1 ? 'page-break-after: always;' : ''}">
                 ${getSampulHTML(s)}
               </div>
            `).join('')}
            <scr`+`ipt>window.print();</scr`+`ipt>
          </body></html>
        `;
        const win = window.open('', '_blank'); win.document.write(combinedHTML); win.document.close();
      };

      return (
        <div className="bg-white/90 backdrop-blur-sm p-6 sm:p-10 rounded-[2rem] border border-slate-100 shadow-sm max-w-2xl mx-auto text-center mt-6 sm:mt-10">
          <div className="w-16 h-16 sm:w-24 sm:h-24 bg-blue-50 rounded-2xl sm:rounded-[2rem] flex items-center justify-center mx-auto mb-4 sm:mb-6 text-blue-600"><FileBadge className="text-2xl sm:text-4xl"/></div>
          <h2 className="font-extrabold text-xl sm:text-2xl text-slate-800 mb-2">Cetak Sampul Rapor</h2>
          <p className="text-slate-500 font-medium text-xs sm:text-sm mb-6 sm:mb-8">Otomatis mencetak Cover (Sampul 1) dan Identitas Biodata Lengkap (Sampul 2) per siswa.</p>
          
          <select className="w-full p-3 sm:p-4 border border-slate-200 rounded-xl sm:rounded-2xl mb-6 sm:mb-8 outline-none focus:ring-2 focus:ring-blue-500 font-bold text-slate-700 bg-slate-50 text-xs sm:text-sm" value={selectedStudent} onChange={e=>setSelectedStudent(e.target.value)}>
            <option value="ALL">Cetak Semua Siswa ({students.length} Siswa)</option>
            {students.map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
          </select>
          
          <button onClick={handlePrint} className="bg-blue-600 hover:bg-blue-700 text-white px-6 sm:px-10 py-3 sm:py-4 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-lg w-full shadow-xl flex items-center justify-center gap-3 transition-all"><ExternalLink /> Buka & Cetak Sampul</button>
        </div>
      );
    }

    // Eksekusi Mounting Aplikasi
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
