    // === Helper Fase Kurikulum Merdeka (A–F) ===

    const getFaseFromKelas = (kelasInput) => {
       if (kelasInput === null || kelasInput === undefined) return '-';
       let n = 0;
       if (typeof kelasInput === 'number') n = kelasInput;
       else {
         const m = String(kelasInput).match(/\d+/);
         n = m ? parseInt(m[0], 10) : 0;
       }
       if (n === 1 || n === 2) return 'A';
       if (n === 3 || n === 4) return 'B';
       if (n === 5 || n === 6) return 'C';
       if (n >= 7 && n <= 9) return 'D';
       if (n === 10) return 'E';
       if (n === 11 || n === 12) return 'F';

    const toProperCase = (str) => {
      if (!str) return '';
      return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
    };

    function parseCSV(str) {
      const arr = []; let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
          if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
          if (cc === '"') { quote = !quote; continue; }
          if (cc === ',' && !quote) { ++col; continue; }
          if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc === '\n' && !quote) { ++row; col = 0; continue; }
          if (cc === '\r' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
      }
      return arr;
    }

    // CSV download helper
    function downloadCSVFile(filename, rows) {
      const esc = (v) => {
        const s = (v == null ? '' : String(v));
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const csv = rows.map(r => r.map(esc).join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    // XLSX download helper — clean tabular Excel file with bold header & auto column widths
    function downloadXLSXFile(filename, rows, sheetName) {
      try {
        if (!window.XLSX) { return downloadCSVFile(filename.replace(/\.xlsx$/i, '.csv'), rows); }
        const ws = XLSX.utils.aoa_to_sheet(rows);
        // Auto column widths based on max content length
        const colCount = rows.reduce((m, r) => Math.max(m, r.length), 0);
        const colWidths = [];
        for (let c = 0; c < colCount; c++) {
          let max = 8;
          for (let r = 0; r < rows.length; r++) {
            const v = rows[r] && rows[r][c] != null ? String(rows[r][c]) : '';
            if (v.length > max) max = v.length;
          }
          colWidths.push({ wch: Math.min(max + 2, 50) });
        }
        ws['!cols'] = colWidths;
        // Bold header row + freeze first row
        const range = XLSX.utils.decode_range(ws['!ref']);
        for (let c = range.s.c; c <= range.e.c; c++) {
          const addr = XLSX.utils.encode_cell({ r: 0, c });
          if (ws[addr]) {
            ws[addr].s = { font: { bold: true }, alignment: { horizontal: 'center' }, fill: { fgColor: { rgb: 'D1D5DB' } } };
          }
        }
        ws['!freeze'] = { xSplit: 0, ySplit: 1 };
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, (sheetName || 'Sheet1').slice(0, 31));
        XLSX.writeFile(wb, filename.endsWith('.xlsx') ? filename : filename.replace(/\.csv$/i, '') + '.xlsx');
      } catch (e) {
        console.error('XLSX export failed', e);
        downloadCSVFile(filename.replace(/\.xlsx$/i, '.csv'), rows);
      }
    }
     function buildWatermarkHTML(profil, temaConfig) {

         rows += `<div style="${lineStyle} margin-bottom:${rowGap}px;">${oneLine}</div>`;

       const logoTag = logo ? `<img src="${logo}" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:55%; max-width:55%; max-height:55%; object-fit:contain; opacity:0.55; mix-blend-mode:multiply;" alt="logo" />` : '';

     }

    // Hook Hitung Mundur
    function useCountdown(deadlineStr) {
      const [timeLeft, setTimeLeft] = useState('');
      const [isExpired, setIsExpired] = useState(false);

      useEffect(() => {
        if(!deadlineStr) { setTimeLeft(''); setIsExpired(false); return; }
        
        const timer = setInterval(() => {
          const now = new Date().getTime();
          const dest = new Date(deadlineStr).getTime();
          const dist = dest - now;

          if(dist <= 0) { 
            setTimeLeft('00h 00j 00m 00d'); 
            setIsExpired(true);
            clearInterval(timer); 
            return; 
          }
          
          setIsExpired(false);
          const d = Math.floor(dist / (1000 * 60 * 60 * 24));
          const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
          const s = Math.floor((dist % (1000 * 60)) / 1000);
          
          let res = [];
          if(d > 0) res.push(`${d} Hari`);
          res.push(`${h} Jam`);
          res.push(`${m} Menit`);
          res.push(`${s} Detik`);
          
          setTimeLeft(res.join(' '));
        }, 1000);
        return () => clearInterval(timer);
      }, [deadlineStr]);

      return { timeLeft, isExpired };
    }

      const [loadingProgress, setLoadingProgress] = useState(0); 
      
      // PERSISTENT LOGIN (Sesi tidak hilang saat refresh)
      const [user, setUser] = useState(() => {
         const saved = localStorage.getItem(LSK('eraaport_user'));
         return saved ? JSON.parse(saved) : null;
      }); 

      const [activeMenu, setActiveMenu] = useState('dashboard');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [toastMessage, setToastMessage] = useState(null);
      
      // Photo Modal State
      const [showPhotoModal, setShowPhotoModal] = useState(false);

      // PWA Install Prompt State
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const [profilSekolah, setProfilSekolah] = useState(INITIAL_PROFIL);
      const [temaConfig, setTemaConfig] = useState(INITIAL_TEMA);
      const [appConfig, setAppConfig] = useState(INITIAL_APP_CONFIG);
      const [guruProfil, setGuruProfil] = useState({});
      const [teachers, setTeachers] = useState(INITIAL_TEACHERS);
      const [mapelList, setMapelList] = useState(INITIAL_MAPEL);
      const [ekskulList, setEkskulList] = useState(INITIAL_EKSKUL);
      const [allStudents, setAllStudents] = useState([]); 
      
      const [materiGuru, setMateriGuru] = useState({}); 
      const [studentGrades, setStudentGrades] = useState({}); 
      const [absensi, setAbsensi] = useState({}); 
      const [ekskulData, setEkskulData] = useState({}); 
      const [kokuData, setKokuData] = useState({}); 
      const [guruMapelConfig, setGuruMapelConfig] = useState({}); 
      const [guruRombelConfig, setGuruRombelConfig] = useState({}); 
      const [dimensiTarget, setDimensiTarget] = useState([DIMENSI_P5[0], DIMENSI_P5[5], DIMENSI_P5[3]]);
      const [kkmConfig, setKkmConfig] = useState(INITIAL_KKM);

      const [confirmDialog, setConfirmDialog] = useState(null);

      // PWA Listener + Service Worker Registration
      useEffect(() => {
         window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            setDeferredPrompt(e);
         });
         // Register service worker (offline cache) - inline blob
         if ('serviceWorker' in navigator) {
            // === MULTI-TENANT FIX: unregister SW lama supaya tidak melayani cache sekolah lain ===
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
            if (window.caches && caches.keys) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{});
         }
         if (false && 'serviceWorker' in navigator) {
            const swCode = `
              const CACHE = 'eraport-cache-v1';
              const ASSETS = [self.location.href.replace(/sw\\.js$/, '')];
              self.addEventListener('install', e => {
                self.skipWaiting();
                e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
              });
              self.addEventListener('activate', e => { self.clients.claim(); });
              self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                  caches.match(e.request).then(cached => cached || fetch(e.request).then(resp => {
                    if (resp && resp.status === 200 && resp.type === 'basic') {
                       const copy = resp.clone();
                       caches.open(CACHE).then(c => c.put(e.request, copy));
                    }
                    return resp;
                  }).catch(() => cached))
                );
              });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(()=>{});
         }
      }, []);

      // Update PWA manifest dinamis sesuai logo sekolah dari profil admin
      // Logo akan otomatis dipakai sebagai icon aplikasi PWA saat di-install ke layar HP.
      useEffect(() => {
         if (profilSekolah?.logo) {
            const logoUrl = cleanLogoUrl(profilSekolah.logo);
            // Deteksi tipe MIME dari ekstensi URL
            const lower = String(logoUrl).toLowerCase();
            let mime = 'image/png';
            if (lower.endsWith('.jpg') || lower.endsWith('.jpeg')) mime = 'image/jpeg';
            else if (lower.endsWith('.svg')) mime = 'image/svg+xml';
            else if (lower.endsWith('.webp')) mime = 'image/webp';
            else if (lower.startsWith('data:')) {
              const m = lower.match(/^data:([^;,]+)/);
              if (m) mime = m[1];
            }
            const manifest = {
               name: `E-Raport ${profilSekolah.namaSekolah || 'Qu'}`,
               short_name: profilSekolah.namaSekolah ? profilSekolah.namaSekolah.substring(0, 12) : 'E-Raport',
               start_url: '.',
               display: 'standalone',
               background_color: '#ecfdf5',
               theme_color: '#0d5c3b',
               orientation: 'portrait',
               icons: [
                  { src: logoUrl, sizes: '192x192', type: mime, purpose: 'any' },
                  { src: logoUrl, sizes: '512x512', type: mime, purpose: 'any' },
                  { src: logoUrl, sizes: '512x512', type: mime, purpose: 'maskable' }
               ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const url = URL.createObjectURL(blob);
            const link = document.getElementById('pwa-manifest');
            if (link) link.href = url;
            // Update juga apple-touch-icon supaya iOS pakai logo sekolah saat Add to Home Screen
            const apple = document.getElementById('apple-icon');
            if (apple) apple.href = logoUrl;
            const fav = document.getElementById('favicon-icon');
            if (fav) fav.href = logoUrl;
         }
      }, [profilSekolah?.logo, profilSekolah?.namaSekolah]);

      const handleInstallApp = async () => {
         if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') setDeferredPrompt(null);
         }
      };

      // Mencegah Tombol Back dan Refresh Tanpa Sengaja - DIPERBAIKI: Back ke home tanpa logout & tanpa reload
      useEffect(() => {
         if (user) {
            window.history.pushState({ inApp: true }, '', window.location.href);
            
            const handlePopState = (event) => {
               const confirmExit = window.confirm("Yakin ingin keluar dari aplikasi?\n\nTekan OK untuk keluar dari halaman ini (Anda tetap login, masuk lagi tidak perlu memuat ulang).");
               if (confirmExit) {
                  // Biarkan back natural — keluar dari aplikasi (ke homescreen / tab sebelumnya). User tetap login.
                  window.history.back();
               } else {
                  window.history.pushState({ inApp: true }, '', window.location.href);
               }
            };
            
            // Hanya tampilkan beforeunload jika user sedang aktif input data (tidak agresif)
            window.addEventListener('popstate', handlePopState);
            
            return () => {
               window.removeEventListener('popstate', handlePopState);
            };
         }
      }, [user]);

      useEffect(() => {
         const t = COLOR_THEMES[temaConfig.colorTheme] || COLOR_THEMES.hijau;
         document.documentElement.style.setProperty('--color-primary', t.primary);
         document.documentElement.style.setProperty('--color-primary-hover', t.primaryHover);
         document.documentElement.style.setProperty('--color-primary-light', t.primaryLight);
      }, [temaConfig.colorTheme]);

      useEffect(() => {
        const handleDemoToast = (e) => showToast(e.detail);
        window.addEventListener('demo-toast', handleDemoToast);

        const fetchInitialData = async () => {
          const activeYear = localStorage.getItem(LSK('activeTahunAjaran')) || '2025_2026';
          const cacheKey = LSK(`eraaport_cache_${activeYear}`);
          
          // 1. Cek cache localStorage terlebih dahulu agar load instan
          let usedCache = false;
          try {
             const cached = localStorage.getItem(cacheKey);
             if (cached) {
                const json = JSON.parse(cached);
                if (json && json.data) {
                   const d = json.data;
                   if (d.profil) setProfilSekolah(d.profil);
                   if (d.temaConfig) setTemaConfig(d.temaConfig);
                   if (d.appConfig) setAppConfig(d.appConfig);
                   if (d.guruProfil) setGuruProfil(d.guruProfil);
                   if (d.teachers) setTeachers(d.teachers);
                   if (d.mapel) setMapelList(d.mapel);
                   if (d.ekskul) setEkskulList(d.ekskul);
                   if (d.allStudents) setAllStudents(d.allStudents);
                   if (d.materiGuru) setMateriGuru(d.materiGuru);
                   if (d.studentGrades) setStudentGrades(d.studentGrades);
                   if (d.absensi) setAbsensi(d.absensi);
                   if (d.ekskulData) setEkskulData(d.ekskulData);
                   if (d.kokuData) setKokuData(d.kokuData);
                   if (d.guruMapelConfig) setGuruMapelConfig(d.guruMapelConfig);
                   if (d.guruRombelConfig) setGuruRombelConfig(d.guruRombelConfig);
                   if (d.dimensiTarget) setDimensiTarget(d.dimensiTarget);
                   if (d.kkmConfig) setKkmConfig(d.kkmConfig);
                   usedCache = true;
                   // Langsung 100% lalu masuk sistem
                   setLoadingProgress(100);
                   setTimeout(() => setIsAppLoading(false), 200);
                }
             }
          } catch(_) { /* abaikan */ }

          // 2. Animasi loading (hanya jika tanpa cache)
          let progress = usedCache ? 100 : 0;
          const animInterval = usedCache ? null : setInterval(() => {
             progress += Math.floor(Math.random() * 15) + 8;
             if(progress > 92) progress = 92;
             setLoadingProgress(progress);
          }, 150);

          // 3. Fetch data terbaru dari server
          try {
            const res = await fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'loadAll', tahunAjaran: `Tahun_${activeYear}` })
            });
            const json = await res.json();
            
            if (json.status === 'success' && json.data) {
              if (json.data.profil) setProfilSekolah(json.data.profil);
              if (json.data.temaConfig) setTemaConfig(json.data.temaConfig);
              if (json.data.appConfig) setAppConfig(json.data.appConfig);
              if (json.data.guruProfil) setGuruProfil(json.data.guruProfil);
              if (json.data.teachers) setTeachers(json.data.teachers);
              if (json.data.mapel) setMapelList(json.data.mapel);
              if (json.data.ekskul) setEkskulList(json.data.ekskul);
              if (json.data.allStudents) setAllStudents(json.data.allStudents);
              if (json.data.materiGuru) setMateriGuru(json.data.materiGuru);
              if (json.data.studentGrades) setStudentGrades(json.data.studentGrades);
              if (json.data.absensi) setAbsensi(json.data.absensi);
              if (json.data.ekskulData) setEkskulData(json.data.ekskulData);
              if (json.data.kokuData) setKokuData(json.data.kokuData);
              if (json.data.guruMapelConfig) setGuruMapelConfig(json.data.guruMapelConfig);
              if (json.data.guruRombelConfig) setGuruRombelConfig(json.data.guruRombelConfig);
              if (json.data.dimensiTarget) setDimensiTarget(json.data.dimensiTarget);
              if (json.data.kkmConfig) setKkmConfig(json.data.kkmConfig);
              // Simpan cache untuk load berikutnya
              try { localStorage.setItem(cacheKey, JSON.stringify(json)); } catch(_) {}
            }
          } catch (e) {
            console.error("Gagal load initial data", e);
          } finally {
            if (animInterval) clearInterval(animInterval);
            if (!usedCache) {
               setLoadingProgress(100);
               setTimeout(() => setIsAppLoading(false), 300); 
            }
          }
        };
        fetchInitialData();
        return () => window.removeEventListener('demo-toast', handleDemoToast);
      }, []);

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };
      const showConfirm = (message, onConfirm) => { setConfirmDialog({ message, onConfirm }); };

      const handleLogin = (role, nama, username) => {
        const userData = { role, name: nama || (role === 'admin' ? (profilSekolah.kepalaSekolah || 'Admin Kepala Sekolah') : 'Guru'), username };
        setUser(userData);
        localStorage.setItem(LSK('eraaport_user'), JSON.stringify(userData));
        setActiveMenu('dashboard');
      };

      // FUNGSI LOGOUT DIPERBAIKI: Tanpa reload halaman, langsung kembali ke Login Screen
      const handleLogout = () => {
         localStorage.removeItem(LSK('eraaport_user'));
         window.isDemoAccount = false;
         setUser(null);
         setActiveMenu('dashboard');
      };

      const { isExpired: timeIsUp } = useCountdown(appConfig.deadline);
      const isAppLocked = appConfig.isLocked || timeIsUp;

      const currentRombel = guruRombelConfig[user?.username] || '';

      const students = useMemo(() => {
        if (!user) return [];
        if (user.role === 'admin') return allStudents;
        if (!currentRombel) return [];
        return allStudents.filter(s => s.rombelSD === currentRombel);
      }, [user, allStudents, currentRombel]);

      // DAFTAR MAPEL DIBUAT SPESIFIK BERDASARKAN KELAS/ROMBEL GURU
      const currentMapelKey = `${user?.username}_${currentRombel}`;
      const activeMapelList = user?.role === 'admin' 
        ? mapelList 
        : (guruMapelConfig[currentMapelKey] !== undefined && guruMapelConfig[currentMapelKey].length > 0
            ? guruMapelConfig[currentMapelKey] 
            : mapelList);

      // Helper: cek nilai valid (lebih dari 0 dan bukan string kosong)
      const isValidScore = (v) => v !== undefined && v !== null && v !== '' && !isNaN(v) && Number(v) > 0;

      const calculateNA = (mapel, studentId, rombelSD, mg = materiGuru, sg = studentGrades) => {
        const materiKey = `${rombelSD}_${mapel}`;
        const materi = mg[materiKey] || [];
        const scores = (sg[mapel] || {})[studentId] || {};
        let totalM = 0, countM = 0;

        // STRATEGI 1: Iterasi materi list (paling akurat)
        if (materi.length > 0) {
          materi.forEach((m, idx) => {
            if(m && m.trim() !== '' && isValidScore(scores[`m${idx}`])) {
               totalM += Number(scores[`m${idx}`]); countM++;
            }
          });
        }

        // STRATEGI 2: Fallback - jika materi list kosong/mismatch rombel, ambil semua key 'm*' di scores
        // Ini memastikan nilai yang sudah diinput guru TETAP TERAMBIL walau materiGuru[key] hilang/salah rombel
        if (countM === 0) {
          Object.keys(scores).forEach(k => {
            if (/^m\d+$/.test(k) && isValidScore(scores[k])) {
              totalM += Number(scores[k]); countM++;
            }
          });
        }

        const stsValid = isValidScore(scores.sts);
        const sasValid = isValidScore(scores.sas);
        // Jika tidak ada satupun nilai valid (materi, STS, atau SAS), kembalikan null
        if (countM === 0 && !stsValid && !sasValid) return null;
        const rataM = countM > 0 ? totalM / countM : 0;
        const stsNum = stsValid ? Number(scores.sts) : 0;
        const sasNum = sasValid ? Number(scores.sas) : 0;
        let komponen = 0;
        if (countM > 0) komponen++;
        if (stsValid) komponen++;
        if (sasValid) komponen++;
        return parseFloat(((rataM + stsNum + sasNum) / komponen).toFixed(2));
      };

      const getPredikat = (nilai, config = kkmConfig) => {
        if(nilai === null || nilai === undefined || isNaN(nilai)) return '-';
        const n = parseFloat(nilai);
        if(n >= config.batasA) return 'A';
        if(n >= config.batasB) return 'B';
        if(n >= config.batasC) return 'C';
        return 'D';
      };

      if (isAppLoading) {
        return (
          <div className="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center p-6 text-center">
            {profilSekolah.logo ? (
              <img src={cleanLogoUrl(profilSekolah.logo)} className="w-32 h-32 mb-8 object-contain drop-shadow-xl animate-pulse" alt="Logo Sekolah" />
            ) : (
              <GraduationCap className="w-24 h-24 text-primary mb-8 animate-pulse text-6xl" />
            )}
            <div className="w-full max-w-sm h-6 bg-slate-200 rounded-full overflow-hidden mb-4 shadow-inner relative">
               <div className="h-full bg-gradient-to-r from-emerald-500 to-primary transition-all duration-300 ease-out flex items-center justify-end pr-3" style={{width: `${loadingProgress}%`}}>
                  {loadingProgress > 10 && <span className="text-xs text-white font-bold">{loadingProgress}%</span>}
               </div>
            </div>
            <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight mb-2">Memuat Database E-Raport Qu...</h2>
            <p className="text-sm font-bold text-slate-500 mt-4 bg-primaryLight px-4 py-2 rounded-full border border-primary/20">Version 1.0 by Amal Khairi, S.Pd., Gr.</p>
          </div>
        );
      }

      const activeContext = { profil: profilSekolah, temaConfig, appConfig, guruProfil, teachers, mapel: mapelList, ekskul: ekskulList, allStudents, materiGuru, studentGrades, absensi, ekskulData, kokuData, guruMapelConfig, dimensiTarget, kkmConfig };

      if (!user) return <LoginScreen onLogin={handleLogin} teachers={teachers} profil={profilSekolah} temaConfig={temaConfig} deferredPrompt={deferredPrompt} handleInstallApp={handleInstallApp} />;

      const renderContent = () => {
        if (user.role === 'admin') {
          switch (activeMenu) {
            case 'dashboard': return <AdminDashboard teachers={teachers} students={allStudents} />;
            case 'data_guru': return <AdminDataGuru teachers={teachers} setTeachers={setTeachers} profil={profilSekolah} showToast={showToast} showConfirm={showConfirm} />;
            case 'master_mapel': return <AdminMasterMapel mapel={mapelList} setMapel={setMapelList} ekskul={ekskulList} setEkskul={setEkskulList} profil={profilSekolah} showToast={showToast} />;
            case 'kkm_nilai': return <AdminKKM kkmConfig={kkmConfig} setKkmConfig={setKkmConfig} profil={profilSekolah} showToast={showToast} />;
            case 'data_siswa': return <AdminDataSiswa allStudents={allStudents} setAllStudents={setAllStudents} profil={profilSekolah} showToast={showToast} teachers={teachers} />;
            case 'profil': return <AdminProfil profil={profilSekolah} setProfil={setProfilSekolah} showToast={showToast} />;
            case 'pengaturan_tema': return <AdminPengaturanTema temaConfig={temaConfig} setTemaConfig={setTemaConfig} profil={profilSekolah} showToast={showToast} />;
            case 'pengaturan_akses': return <AdminPengaturanAkses appConfig={appConfig} setAppConfig={setAppConfig} profil={profilSekolah} showToast={showToast} />;
            case 'progress_guru': return <AdminProgressGuru teachers={teachers} students={allStudents} mapelList={mapelList} studentGrades={studentGrades} materiGuru={materiGuru} calculateNA={calculateNA} />;
            case 'leger_admin': return <AdminPrintFilter defaultContext={activeContext} showToast={showToast} renderComponent={(filtered, rombel, waliName, ctx, printProfil) => <GuruLeger students={filtered} mapelList={ctx.mapel} calculateNA={(m, id) => calculateNA(m, id, rombel, ctx.materiGuru, ctx.studentGrades)} profil={printProfil} waliKelasName={waliName} temaConfig={ctx.temaConfig} showToast={showToast} />} />;
            case 'cetak_rapor_admin': return <AdminPrintFilter defaultContext={activeContext} showToast={showToast} renderComponent={(filtered, rombel, waliName, ctx, printProfil) => <GuruCetakRapor students={filtered} mapelList={ctx.mapel} teachers={ctx.teachers} calculateNA={(m, id) => calculateNA(m, id, rombel, ctx.materiGuru, ctx.studentGrades)} getPredikat={(n) => getPredikat(n, ctx.kkmConfig)} profil={printProfil} waliKelasName={waliName} kokuData={ctx.kokuData} dimensiTarget={ctx.dimensiTarget} ekskulList={ctx.ekskul} ekskulData={ctx.ekskulData} absensi={ctx.absensi} materiGuru={ctx.materiGuru} studentGrades={ctx.studentGrades} kkmConfig={ctx.kkmConfig} temaConfig={ctx.temaConfig} showToast={showToast} />} />;
            case 'cetak_sampul_admin': return <AdminPrintFilter defaultContext={activeContext} showToast={showToast} renderComponent={(filtered, rombel, waliName, ctx, printProfil) => <GuruCetakSampul students={filtered} profil={printProfil} temaConfig={ctx.temaConfig} showToast={showToast} />} />;
            case 'cetak_admin': return <AdminCetakAdministrasi activeContext={activeContext} calculateNA={calculateNA} showToast={showToast} />;
            case 'pusat_unduhan': return <AdminPusatUnduhan ctx={activeContext} showToast={showToast} />;
            default: return <AdminDashboard teachers={teachers} students={allStudents} />;
          }
        } else {
          switch (activeMenu) {
            case 'dashboard': return <GuruDashboard user={user} students={students} mapelList={activeMapelList} studentGrades={studentGrades} calculateNA={calculateNA} appConfig={appConfig} />;
            case 'profil_guru': return <GuruProfil guruProfil={guruProfil} setGuruProfil={setGuruProfil} username={user.username} profil={profilSekolah} showToast={showToast} />;
            case 'pengaturan_mapel': return <GuruPengaturanMapel mapelList={mapelList} activeMapelList={activeMapelList} setGuruMapelConfig={setGuruMapelConfig} username={user.username} profil={profilSekolah} showToast={showToast} isAppLocked={isAppLocked} appConfig={appConfig} selectedRombel={currentRombel} />;
            case 'tarik_siswa': return <GuruTarikSiswa allStudents={allStudents} guruRombelConfig={guruRombelConfig} setGuruRombelConfig={setGuruRombelConfig} username={user.username} profil={profilSekolah} teachers={teachers} showToast={showToast} isAppLocked={isAppLocked} appConfig={appConfig} />;
            case 'input_materi': return <GuruInputMateri mapelList={activeMapelList} materiGuru={materiGuru} setMateriGuru={setMateriGuru} profil={profilSekolah} showToast={showToast} isAppLocked={isAppLocked} appConfig={appConfig} selectedRombel={currentRombel} />;
           case 'input_nilai': return <GuruInputNilai mapelList={activeMapelList} materiGuru={materiGuru} studentGrades={studentGrades} setStudentGrades={setStudentGrades} students={students} calculateNA={calculateNA} profil={profilSekolah} showToast={showToast} showConfirm={showConfirm} isAppLocked={isAppLocked} appConfig={appConfig} selectedRombel={currentRombel} kkmConfig={kkmConfig} />;
            case 'input_absensi': return <GuruInputAbsensi students={students} absensi={absensi} setAbsensi={setAbsensi} profil={profilSekolah} showToast={showToast} showConfirm={showConfirm} isAppLocked={isAppLocked} appConfig={appConfig} />;
            case 'input_ekskul': return <GuruInputEkskul students={students} ekskulList={ekskulList} ekskulData={ekskulData} setEkskulData={setEkskulData} profil={profilSekolah} showToast={showToast} showConfirm={showConfirm} isAppLocked={isAppLocked} appConfig={appConfig} />;
            case 'input_koku': return <GuruInputKoku students={students} kokuData={kokuData} setKokuData={setKokuData} dimensiTarget={dimensiTarget} setDimensiTarget={setDimensiTarget} profil={profilSekolah} showToast={showToast} showConfirm={showConfirm} isAppLocked={isAppLocked} appConfig={appConfig} />;
            case 'leger': return <GuruLeger students={students} mapelList={mapelList} calculateNA={calculateNA} profil={profilSekolah} waliKelasName={user.name} temaConfig={temaConfig} showToast={showToast} />;
            case 'cetak_rapor': return <GuruCetakRapor students={students} mapelList={mapelList} teachers={teachers} calculateNA={calculateNA} getPredikat={getPredikat} profil={profilSekolah} waliKelasName={user.name} kokuData={kokuData} dimensiTarget={dimensiTarget} ekskulList={ekskulList} ekskulData={ekskulData} absensi={absensi} materiGuru={materiGuru} studentGrades={studentGrades} kkmConfig={kkmConfig} temaConfig={temaConfig} showToast={showToast} />;
            case 'cetak_sampul': return <GuruCetakSampul students={students} profil={profilSekolah} temaConfig={temaConfig} showToast={showToast} />;

        { id: 'data_guru', label: 'Data Guru', icon: <Users /> },
        { id: 'master_mapel', label: 'Master Mapel & Ekskul', icon: <BookOpen /> },
        { id: 'kkm_nilai', label: 'KKM & Predikat', icon: <Settings /> },
        { id: 'data_siswa', label: 'Sinkron Siswa (CSV)', icon: <FileSpreadsheet /> },
        { id: 'profil', label: 'Profil Sekolah', icon: <Building /> },
        { id: 'pengaturan_tema', label: 'Pengaturan Tema', icon: <Palette /> },
        { id: 'pengaturan_akses', label: 'Pengumuman & Akses', icon: <Bullhorn /> },
        { id: 'progress_guru', label: 'Progress Pengisian', icon: <PieChart /> },
        { id: 'leger_admin', label: 'Cetak Leger Global', icon: <FileSpreadsheet /> },
        { id: 'cetak_rapor_admin', label: 'Cetak Rapor Global', icon: <Printer /> },
        { id: 'cetak_sampul_admin', label: 'Cetak Sampul Global', icon: <FileBadge /> },
        { id: 'cetak_admin', label: 'Cetak Administrasi', icon: <Trophy /> },
        { id: 'pusat_unduhan', label: 'Pusat Unduhan', icon: <Download /> },
      ] : [
        { id: 'dashboard', label: 'Dashboard Guru', icon: <Home /> },
        { id: 'profil_guru', label: 'Profil Guru', icon: <UserIcon /> },
        { id: 'pengaturan_mapel', label: 'Pilih Mapel Diampu', icon: <Filter /> },
        { id: 'tarik_siswa', label: 'Pilih / Tarik Siswa', icon: <Download /> },

        { id: 'input_nilai', label: 'Input Nilai Akademik', icon: <FileText /> },
        { id: 'input_absensi', label: 'Input Kehadiran', icon: <ClipboardList /> },
        { id: 'input_ekskul', label: 'Nilai Ekstrakurikuler', icon: <Activity /> },
        { id: 'input_koku', label: 'Nilai Kokurikuler (P5)', icon: <Users /> },
        { id: 'leger', label: 'Cetak Leger Kelas', icon: <FileSpreadsheet /> },
        { id: 'cetak_rapor', label: 'Cetak Rapor', icon: <Printer /> },
        { id: 'cetak_sampul', label: 'Cetak Sampul Rapor', icon: <FileBadge /> },
      ];

      const userPhoto = user.role === 'admin' 
        ? (temaConfig.adminPhoto ? cleanLogoUrl(temaConfig.adminPhoto) : null)
        : (guruProfil[user.username]?.photo ? cleanLogoUrl(guruProfil[user.username].photo) : null);

      return (
        <div className="flex h-screen bg-slate-50 font-sans text-slate-800 w-full relative">

               <img src={cleanLogoUrl(profilSekolah.logo)} className="w-[80vw] md:w-[50vw] max-w-2xl object-contain" alt="Watermark" />

          {toastMessage && (

              <CheckCircle2 className="text-xl text-primaryLight" />
              <span className="font-bold text-sm tracking-wide">{toastMessage}</span>
            </div>
          )}

          {confirmDialog && (
            <div className="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center p-4">
              <div className="bg-white p-6 md:p-8 rounded-[2rem] max-w-sm w-full shadow-2xl relative z-10">
                <div className="w-16 h-16 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mb-6 mx-auto">
                  <Trash2 className="text-3xl"/>
                </div>
                <h3 className="text-xl font-extrabold text-slate-800 mb-2 text-center">Konfirmasi Tindakan</h3>
                <p className="text-slate-500 font-medium mb-8 text-center text-sm leading-relaxed">{confirmDialog.message}</p>
                <div className="flex flex-col sm:flex-row justify-center gap-3">
                  <button onClick={() => setConfirmDialog(null)} className="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-all w-full sm:w-auto">Batal</button>
                  <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="px-6 py-3.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow-md transition-all w-full sm:w-auto">Ya, Lanjutkan</button>
                </div>
              </div>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className={`${isSidebarOpen ? 'w-64 border-r border-slate-800' : 'w-0 border-0'} overflow-hidden transition-all duration-300 fixed md:relative z-40 h-full bg-slate-900 text-white shadow-2xl flex flex-col shrink-0`}>
            <div className="p-5 md:p-6 flex items-center gap-3 border-b border-slate-800 whitespace-nowrap min-w-[16rem]">
              {profilSekolah.logo ? (
                <img src={cleanLogoUrl(profilSekolah.logo)} className="w-10 h-10 rounded-xl object-contain bg-white p-0.5 shrink-0" alt="Logo" />
              ) : (
                <div className="bg-primary p-2.5 rounded-xl shrink-0"><GraduationCap className="text-xl text-white" /></div>
              )}
              <div>
                <span className="text-lg font-bold block leading-tight truncate w-36" title="E-Raport Qu">E-Raport Qu</span>
                <span className="text-[10px] md:text-xs text-primaryLight uppercase font-bold tracking-wider opacity-80">{user.role === 'admin' ? 'Admin / Kepsek' : 'Panel Guru'}</span>
              </div>
            </div>
            <nav className="flex-1 px-3 py-6 space-y-1 overflow-y-auto min-w-[16rem]" style={{scrollbarWidth: 'thin'}}>
              {currentMenus.map(menu => (
                <MenuButton key={menu.id} icon={menu.icon} label={menu.label} active={activeMenu === menu.id} onClick={() => { setActiveMenu(menu.id); if(window.innerWidth < 768) setIsSidebarOpen(false); }} />
              ))}
            </nav>
            <div className="p-4 border-t border-slate-800 min-w-[16rem] bg-slate-900 text-center">
              
              <button onClick={() => { 
                  if(window.confirm("YAKIN INGIN KELUAR DARI APLIKASI?\n\nTekan OK untuk kembali ke Layar Login.")) handleLogout(); 
                }} className="flex items-center justify-center w-full px-4 py-3 text-sm font-bold text-red-400 rounded-xl hover:bg-red-500/10 transition-colors mb-4 border border-red-900/50">
                <LogOut className="text-lg mr-3" /> Keluar Aplikasi
              </button>
              <div className="text-[10px] text-slate-500 font-bold tracking-wide leading-tight">
                Version 1.0 by Amal Khairi, S.Pd., Gr.<br/>contact - 085260249230
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 flex flex-col w-full h-full relative overflow-hidden bg-transparent z-10">
            <header className="bg-white/90 backdrop-blur-md border-b border-slate-200 h-16 flex items-center justify-between px-4 sm:px-8 z-20 shrink-0 shadow-sm relative">
              <div className="flex items-center gap-2">
                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors outline-none">
                  <MenuIcon className="text-xl text-slate-700" />
                </button>

                  {currentMenus.find(m => m.id === activeMenu)?.label}
                </h1>

              <div className="flex items-center gap-3 p-1.5 rounded-xl border border-transparent">
                <div className="text-right hidden md:block">
                  <p className="text-sm font-bold text-slate-800 leading-none mb-1">{user.name}</p>
                  <p className="text-xs text-primary font-bold leading-none capitalize">{user.role} {window.isDemoAccount && <span className="text-red-500 ml-1">(Demo)</span>}</p>
                </div>
                {userPhoto ? (
                  <img src={userPhoto} alt="Profil" onClick={() => setShowPhotoModal(true)} className="w-10 h-10 rounded-full object-cover shadow-sm border-2 border-primaryLight cursor-pointer hover:opacity-80 transition-opacity" title="Klik untuk perbesar foto" />
                ) : (
                  <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-primaryHover text-white font-bold flex justify-center items-center shadow-md">
                    {user.name.charAt(0)}
                  </div>
                )}
              </div>
            </header>
            
            <div className="flex-1 overflow-auto p-2 sm:p-6 lg:p-8 relative z-10">
              <div className="max-w-7xl mx-auto pb-12 relative">
                {renderContent()}
              </div>
            </div>
          </main>
          
          {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/60 z-30 md:hidden" onClick={() => setIsSidebarOpen(false)}></div>}

          {/* POPUP FOTO PROFIL */}
          {showPhotoModal && userPhoto && (
            <div className="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onClick={() => setShowPhotoModal(false)}>
              <div className="relative max-w-lg w-full flex justify-center" onClick={e => e.stopPropagation()}>
                <button onClick={() => setShowPhotoModal(false)} className="absolute -top-12 right-0 md:-right-12 text-white hover:text-red-400 text-3xl transition-colors outline-none"><i className="fas fa-times"></i></button>
                <img src={userPhoto} alt="Profil Full" className="max-w-full h-auto rounded-3xl shadow-2xl object-contain max-h-[80vh] border-4 border-white/10" />
              </div>
            </div>
          )}
        </div>
      );

    // --- KOMPONEN PENDUKUNG ---

    function LoginScreen({ onLogin, teachers, profil, temaConfig, deferredPrompt, handleInstallApp }) {
      const [username, setUsername] = useState('');
      const [error, setError] = useState('');
      const [imgError, setImgError] = useState(false);
      const [showIosHint, setShowIosHint] = useState(false);
      // === Daftar tahun ajaran yang ada di database lokal sekolah ini ===
      const knownYears = (() => {
         try { return JSON.parse(localStorage.getItem(LSK('knownYears')) || '[]'); }
         catch(_) { return []; }
      })();
      const currentActive = (() => {
         const a = localStorage.getItem(LSK('activeTahunAjaran')) || '';
         return a ? a.replace('_','/').replace(/_/g,'/') : (profil.tahunAjaran || '');
      })();
      const [selYear, setSelYear] = useState(currentActive || (knownYears[0] || ''));
      const [newYear, setNewYear] = useState('');
      const [showNewYear, setShowNewYear] = useState(knownYears.length === 0);

      const applyYear = (yearStr) => {
         if (!yearStr) return;
         const fmt = yearStr.replace(/\//g, '_').replace(/ /g, '');
         localStorage.setItem(LSK('activeTahunAjaran'), fmt);
         try {
            const arr = JSON.parse(localStorage.getItem(LSK('knownYears')) || '[]');
            if (!arr.includes(yearStr)) { arr.push(yearStr); arr.sort(); localStorage.setItem(LSK('knownYears'), JSON.stringify(arr)); }
         } catch(_) {}
      };

      // Deteksi iOS / Safari (iOS tidak support beforeinstallprompt)
      const isIos = typeof window !== 'undefined' && /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = typeof window !== 'undefined' && (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);

      // Update favicon dinamis sesuai logo sekolah
      useEffect(() => {
         if (profil?.logo) {
            const logoUrl = cleanLogoUrl(profil.logo);
            const fav = document.getElementById('favicon-icon');
            const apple = document.getElementById('apple-icon');
            const og = document.getElementById('og-image');
            const tw = document.getElementById('twitter-image');
            if (fav) fav.href = logoUrl;
            if (apple) apple.href = logoUrl;
            if (og) og.content = logoUrl;
            if (tw) tw.content = logoUrl;
         }
      }, [profil?.logo]);

      const handleSubmit = (e) => {
        e.preventDefault();
        // Pilih / buat tahun ajaran sebelum login
        const finalYear = (showNewYear ? newYear.trim() : selYear).trim();
        if (!finalYear || !/^\d{4}\/\d{4}$/.test(finalYear)) {
           setError('Tahun ajaran tidak valid. Format: 2025/2026');
           return;
        }
        const prevActive = (localStorage.getItem(LSK('activeTahunAjaran')) || '');
        const newActive = finalYear.replace(/\//g, '_').replace(/ /g, '');
        applyYear(finalYear);
        // Jika user pindah tahun ajaran, reload supaya data tahun yang dipilih dimuat
        if (prevActive && prevActive !== newActive) {
           window.location.reload();
           return;
        }
        // LOGIKA AKUN DEMO
        if (username.toLowerCase() === 'demo_admin') {
          window.isDemoAccount = true;
          onLogin('admin', 'Kepsek Demo', 'demo_admin');
        } else if (username.toLowerCase() === 'demo_guru') {
          window.isDemoAccount = true;
          onLogin('guru', 'Wali Kelas Demo', 'demo_guru');
        } else if (username === 'admin') {
          window.isDemoAccount = false;
          onLogin('admin', profil.kepalaSekolah, 'admin');
        } else {
          const guru = teachers.find(t => t.username === username);
          if (guru) {
             window.isDemoAccount = false;
             onLogin('guru', guru.nama, guru.username);
          }
          else setError('Username tidak ditemukan!');
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 relative overflow-hidden font-sans w-full">
          {temaConfig?.useWatermark && profil?.logo && (
            <div className="fixed inset-0 z-[1] pointer-events-none flex items-center justify-center overflow-hidden mix-blend-multiply" style={{opacity: temaConfig.watermarkOpacity / 100}}>
               <img src={cleanLogoUrl(profil.logo)} className="w-[80vw] md:w-[60vw] max-w-2xl object-contain" alt="Watermark" />
            </div>
          )}

          <div className="absolute top-0 left-0 w-full h-96 bg-primary rounded-b-[100px] transform -translate-y-20 shadow-2xl z-0 transition-colors duration-500"></div>
          <div className="bg-white/95 backdrop-blur-sm p-8 sm:p-12 rounded-[2rem] shadow-2xl w-full max-w-md relative z-10 border border-slate-100">
            <div className="flex flex-col items-center mb-6">
              <div className="w-24 h-24 bg-primaryLight rounded-3xl flex items-center justify-center mb-4 overflow-hidden border-4 border-white shadow-md">
                {profil.logo && !imgError ? (
                  <img src={cleanLogoUrl(profil.logo)} alt="Logo" className="w-full h-full object-contain p-2" onError={() => setImgError(true)} />
                ) : (
                  <GraduationCap className="text-4xl text-primary" />
                )}
              </div>
              
              <div className="bg-primaryLight text-primary font-black tracking-widest uppercase text-[10px] sm:text-xs mb-2 px-4 py-1.5 rounded-full border border-primary/20 shadow-sm">ERAPORT-QU</div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight text-center px-2 leading-tight">
                 {profil.namaSekolah || 'Aplikasi Rapor Sekolah'}
              </h1>
              {profil.alamat && <p className="text-slate-500 font-medium mt-3 text-center text-xs leading-relaxed max-w-sm px-4">{profil.alamat}</p>}
              {profil.motto && <p className="text-primary font-bold mt-2 text-center text-sm italic px-4">"{profil.motto}"</p>}
              {!profil.namaSekolah && <p className="text-slate-500 font-medium mt-2 text-center text-sm">Silahkan Login (Gunakan Username)</p>}
            </div>
            {error && <div className="bg-red-50 text-red-600 font-bold text-sm p-4 rounded-xl mb-6 text-center border border-red-100">{error}</div>}
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
                <label className="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider">Tahun Ajaran (Database Sekolah)</label>
                {!showNewYear && knownYears.length > 0 && (
                  <div className="flex gap-2">
                    <select value={selYear} onChange={e => setSelYear(e.target.value)} className="flex-1 p-2.5 bg-white border border-slate-200 rounded-lg font-bold text-sm focus:ring-2 focus:ring-primary outline-none">
                      {knownYears.map(y => <option key={y} value={y}>{y}</option>)}
                    </select>
                    <button type="button" onClick={() => setShowNewYear(true)} className="px-3 py-2 bg-primary text-white rounded-lg text-xs font-bold shadow-sm" title="Buat database baru">+ Baru</button>
                  </div>
                )}
                {showNewYear && (
                  <div className="flex gap-2">
                    <input type="text" value={newYear} onChange={e => setNewYear(e.target.value)} placeholder="cth: 2026/2027" className="flex-1 p-2.5 bg-white border border-slate-200 rounded-lg font-bold text-sm focus:ring-2 focus:ring-primary outline-none text-center" />
                    {knownYears.length > 0 && (
                      <button type="button" onClick={() => setShowNewYear(false)} className="px-3 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Batal</button>
                    )}
                  </div>
                )}
                <p className="text-[10px] text-slate-500 leading-tight">{knownYears.length === 0 ? 'Belum ada database sekolah. Masukkan tahun ajaran baru untuk mulai.' : 'Pilih tahun ajaran dari database, atau klik "+ Baru" untuk membuat database baru.'}</p>
              </div>
              <input type="text" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-primary outline-none transition-all text-center" placeholder="Masukkan Username Anda" value={username} onChange={e=>setUsername(e.target.value)} data-testid="login-username-input"/>
              <button type="submit" className="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]" data-testid="login-submit-btn">Masuk Aplikasi</button>
            </form>
            
            {/* PWA INSTALL CARD CANTIK - tampil jika belum standalone */}
            {!isStandalone && (deferredPrompt || isIos) && (
              <div className="mt-6 bg-gradient-to-br from-primary via-primaryHover to-emerald-700 p-[2px] rounded-2xl shadow-xl">
                <div className="bg-white rounded-[14px] p-4">
                  <div className="flex items-center gap-3 mb-3">
                     <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-emerald-600 flex items-center justify-center shadow-md shrink-0 overflow-hidden">
                        {profil.logo && !imgError ? (
                          <img src={cleanLogoUrl(profil.logo)} alt="Logo" className="w-full h-full object-contain p-1" />
                        ) : (
                          <i className="fas fa-mobile-alt text-white text-xl"></i>
                        )}
                     </div>
                     <div className="flex-1 min-w-0">
                        <div className="font-extrabold text-slate-800 text-sm leading-tight">Pasang Aplikasi di HP</div>
                        <div className="text-[11px] text-slate-500 font-medium leading-tight mt-0.5">Akses cepat tanpa buka browser, hemat data & offline-ready</div>
                     </div>
                  </div>
                  {deferredPrompt && !isIos && (
                    <button onClick={handleInstallApp} className="w-full bg-gradient-to-r from-primary to-emerald-600 hover:opacity-90 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-[0.98] flex justify-center items-center gap-2 text-sm" data-testid="pwa-install-btn">
                      <i className="fas fa-download"></i> Install Aplikasi Sekarang
                    </button>
                  )}
                  {isIos && (
                    <>
                      <button onClick={() => setShowIosHint(!showIosHint)} className="w-full bg-gradient-to-r from-primary to-emerald-600 hover:opacity-90 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-[0.98] flex justify-center items-center gap-2 text-sm">
                        <i className="fab fa-apple"></i> Cara Install di iPhone/iPad
                      </button>
                      {showIosHint && (
                        <div className="mt-3 bg-slate-50 rounded-xl p-3 text-[11px] text-slate-700 font-medium leading-relaxed border border-slate-200">
                          <ol className="list-decimal list-inside space-y-1">
                            <li>Buka di <b>Safari</b> (bukan Chrome)</li>
                            <li>Tap tombol <b>Share</b> <i className="fas fa-share-square text-primary"></i> di bawah</li>
                            <li>Pilih <b>"Add to Home Screen"</b></li>
                            <li>Tap <b>Tambah</b> di kanan atas</li>
                          </ol>
                        </div>
                      )}
                    </>
                  )}
                </div>
              </div>
            )}

            <div className="text-center mt-6 text-[10px] text-slate-400 font-bold leading-tight">
               <p>Version 1.0 by Amal Khairi, S.Pd., Gr.</p>
               <p>contact - 085260249230</p>
            </div>
          </div>
        </div>
      );
    }

    function MenuButton({ icon, label, active, onClick }) {
      return (
        <button onClick={onClick} className={`flex items-center w-full px-4 py-3 text-sm font-bold rounded-xl whitespace-nowrap overflow-hidden transition-all ${active ? 'bg-primary text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
          <span className={`mr-3 shrink-0 ${active ? 'text-primaryLight' : 'text-slate-500'}`}>{React.cloneElement(icon, { className: 'text-lg w-5' })}</span>
          {label}
        </button>
      );
    }

    function AppLockBanner({ appConfig }) {
       const { timeLeft, isExpired } = useCountdown(appConfig.deadline);
       
       let displayTime = '';
       if(appConfig.deadline) {
          displayTime = isExpired ? 'Waktu Telah Habis!' : `Sisa Waktu: ${timeLeft}`;
       }

       return (
          <div className={`border-l-4 p-4 rounded-xl mb-6 flex items-start sm:items-center justify-between gap-3 shadow-sm ${appConfig.isLocked || isExpired ? 'bg-red-50 border-red-500' : 'bg-amber-50 border-amber-500'}`}>
             <div className="flex gap-3 items-center">
               <div className={appConfig.isLocked || isExpired ? 'text-red-500 shrink-0' : 'text-amber-500 shrink-0'}>
                 {appConfig.isLocked || isExpired ? <LockIcon className="text-xl" /> : <Clock className="text-xl" />}
               </div>
               <div>
                  <h4 className={`font-bold text-sm ${appConfig.isLocked || isExpired ? 'text-red-800' : 'text-amber-800'}`}>
                    {appConfig.isLocked ? 'Aplikasi Terkunci' : (isExpired ? 'Waktu Berakhir' : 'Pengisian Rapor Dibuka')}

    function AdminDataGuru({ teachers, setTeachers, profil, showToast, showConfirm }) {
      const [pasteData, setPasteData] = useState('');
      const [showPaste, setShowPaste] = useState(false);
      const [csvUrl, setCsvUrl] = useState('');
      const [loadingCsv, setLoadingCsv] = useState(false);

      const handlePasteSubmit = () => {
        try {
          const rows = pasteData.split('\n').filter(r => r.trim() !== '');
          const newTeachers = rows.map((row, index) => {
            const cols = row.split('\t'); 
            return {
              id: Date.now() + index,
              nama: cols[1] || 'Tanpa Nama',
              nip: cols[2] || '-',
              waliKelas: cols[3] || '-',
              mapel: cols[4] || '-',
              username: cols[5] || 'user',
              ket: cols[6] || 'Aktif'
            };
          });
          const updatedList = [...teachers, ...newTeachers];
          setTeachers(updatedList);
          syncToCloud('teachers', updatedList, profil.tahunAjaran);
          setShowPaste(false); setPasteData(''); showToast(`${newTeachers.length} Guru berhasil diimpor & disimpan!`);
        } catch (e) {
          showToast("Format paste tidak sesuai. Pastikan urutan Excel benar.");
        }
      };

      const handleSyncCSV = async () => {
        if(!csvUrl) return;
        setLoadingCsv(true);
        try {
          const res = await fetch(csvUrl);
          if(!res.ok) throw new Error("Gagal mengambil data");
          const text = await res.text();
          const rows = parseCSV(text).filter(r => r && r.some(c => c.trim() !== ''));
          
          if (rows.length > 1) {
            const header = rows[0].map(h => h.trim().toUpperCase());
            const iNama = header.findIndex(h => h.includes('NAMA GURU') || h.includes('NAMA'));
            const iNip = header.findIndex(h => h.includes('NIP'));
            const iWali = header.findIndex(h => h.includes('WALI KELAS') || h.includes('ROMBEL'));
            const iMapel = header.findIndex(h => h.includes('MAPEL') || h.includes('MATA PELAJARAN'));
            const iUser = header.findIndex(h => h.includes('USERNAME') || h.includes('AKUN'));

            const parsed = rows.slice(1).map((row, idx) => {
               const tName = iNama !== -1 ? row[iNama] : `Guru ${idx+1}`;
               if (!tName || tName.trim() === '') return null;
               
               return {
                  id: Date.now() + idx,
                  nama: tName.trim(),
                  nip: iNip !== -1 && row[iNip] ? row[iNip] : '-',
                  waliKelas: iWali !== -1 && row[iWali] ? row[iWali] : '-',
                  mapel: iMapel !== -1 && row[iMapel] ? row[iMapel] : '-',
                  username: iUser !== -1 && row[iUser] ? row[iUser] : tName.toLowerCase().replace(/\s+/g, ''),
                  ket: 'Aktif'
               };
            }).filter(t => t !== null);

            if (parsed.length > 0) {
               showConfirm(`Tarik CSV menemukan ${parsed.length} guru. Data ini akan MENGGANTIKAN data guru saat ini. Lanjutkan?`, () => {
                  setTeachers(parsed);
                  syncToCloud('teachers', parsed, profil.tahunAjaran);
                  showToast(`Berhasil Sinkronisasi ${parsed.length} Data Guru!`);
               });
            } else {
               throw new Error("Data kosong atau format kolom tidak dikenali.");
            }
          }
        } catch (e) {
           showToast("Gagal menarik data. Pastikan link Google Sheets valid, publik (format CSV).");
        }
        setLoadingCsv(false);
      };

      const [editTeacher, setEditTeacher] = useState(null);
      const [editGuruForm, setEditGuruForm] = useState({});
      const openEditGuru = (t) => {
         setEditTeacher(t);
         setEditGuruForm({ nama: t.nama||'', nip: t.nip||'', waliKelas: t.waliKelas||'', mapel: t.mapel||'', username: t.username||'', ket: t.ket||'Aktif' });
      };
      const saveEditGuru = () => {
         if (!editTeacher) return;
         const updated = teachers.map(x => x.id === editTeacher.id ? { ...x, ...editGuruForm } : x);
         setTeachers(updated);
         syncToCloud('teachers', updated, profil.tahunAjaran);
         setEditTeacher(null);
         showToast('Data guru berhasil diperbarui!');

      const deleteAllTeachers = () => {
         showConfirm('PERINGATAN: Anda akan menghapus SELURUH data guru. Lanjutkan?', () => {
            setTeachers([]);
            syncToCloud('teachers', [], profil.tahunAjaran);
            showToast('Semua data guru telah dihapus.');

      const deleteTeacher = (id) => {

            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => downloadXLSXFile('template_guru.xlsx', [['No','Nama Guru','NIP','Wali Kelas','Mapel','Username','Keterangan'],['1','Contoh Budi','198001012005011001','4A','Guru Kelas','budi','Aktif']], 'Template Guru')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-3 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 shadow-md transition-all">
                <Download className="text-sm" /> Template XLSX
              </button>
              <button onClick={() => setShowPaste(!showPaste)} className="bg-primary hover:bg-primaryHover text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2 shadow-md transition-all">
                <Plus className="text-sm" /> Import Paste Excel
              </button>
            </div>
          </div>

          <div className="bg-white/90 backdrop-blur-sm p-4 sm:p-6 rounded-3xl border border-slate-100 shadow-sm">

             <p className="text-[10px] sm:text-xs text-slate-500 mb-4">Pastikan terdapat kolom: Nama Guru, NIP, Wali Kelas, Mapel, Username.</p>
             <div className="flex flex-col md:flex-row gap-3">
                <input type="text" className="flex-1 p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary" placeholder="Masukkan Link CSV..." value={csvUrl} onChange={e=>setCsvUrl(e.target.value)} />
                <button onClick={handleSyncCSV} disabled={loadingCsv} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 disabled:opacity-70 whitespace-nowrap">
                   {loadingCsv ? <RefreshCw className="animate-spin" /> : <Download />} Tarik Data Guru
                </button>
             </div>
          </div>

          {showPaste && (
            <div className="bg-primaryLight/90 backdrop-blur-sm p-4 sm:p-6 rounded-3xl border border-primary/20">
              <h3 className="font-bold text-primary mb-2">Paste Data dari Excel (Copy langsung dari Spreadsheet)</h3>
              <p className="text-[10px] sm:text-xs font-bold text-primary/70 mb-4 bg-white/50 p-3 rounded-lg inline-block">Format Kolom: No | Nama Guru | NIP | Wali Kelas | Mata Pelajaran | Username | Keterangan</p>
              <textarea rows="5" className="w-full p-3 sm:p-4 text-xs sm:text-sm font-mono border border-primary/30 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-primary" value={pasteData} onChange={e => setPasteData(e.target.value)} placeholder="1  Budi  1980..  4A  Guru Kelas  budi  Aktif" />
              <div className="flex gap-3">
                <button onClick={handlePasteSubmit} className="bg-primary hover:bg-primaryHover text-white px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold shadow-md">Simpan Data</button>
                <button onClick={() => setShowPaste(false)} className="bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold">Batal</button>
              </div>
            </div>
          )}

          <div className="bg-white/90 backdrop-blur-sm rounded-xl sm:rounded-3xl border border-slate-200 w-full shadow-sm overflow-x-auto">
            <table className="w-full text-left text-[10px] sm:text-sm table-fixed min-w-[600px] break-words">
              <thead className="bg-slate-50 text-slate-600 font-extrabold border-b border-slate-200">
                <tr>
                  <th className="p-2 sm:px-4 sm:py-3 w-10 sm:w-12 text-center">No</th>

                  <th className="p-2 sm:px-4 sm:py-3 w-[10%] text-center">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {teachers.map((t, i) => (
                  <tr key={t.id} className="hover:bg-primaryLight/30 transition-colors">
                    <td className="p-2 sm:px-4 sm:py-3 text-center text-slate-400 font-bold">{i+1}</td>

        ...kkmConfig,
        kriteria: (kkmConfig.kriteria && kkmConfig.kriteria.length === 4) ? kkmConfig.kriteria : defaultKriteria
      });

      const updateKriteria = (idx, field, value) => {
        const newK = [...localKkm.kriteria];
        newK[idx] = { ...newK[idx], [field]: field === 'label' ? value : (parseInt(value) || 0) };

    function AdminDataSiswa({ allStudents, setAllStudents, profil, showToast, teachers }) {
      const [csvUrl, setCsvUrl] = useState("");
      const [loading, setLoading] = useState(false);
      const [showPaste, setShowPaste] = useState(false);
      const [pasteData, setPasteData] = useState('');

      const handlePasteSiswa = () => {
        try {
          const rows = pasteData.split('\n').filter(r => r.trim() !== '');
          const newSiswa = rows.map((row, idx) => {
            const c = row.split('\t');
            return {
              id: `S-${Date.now()}-${idx}`,
              nama: (c[1]||'Tanpa Nama').trim(),
              nisn: (c[2]||`00${idx}`).trim(),
              nis: (c[3]||'-').trim(),
              rombelSD: (c[4]||'-').trim(),
              tempatTanggalLahir: (c[5]||'-').trim(),
              jenisKelamin: (c[6]||'-').trim(),
              agama: (c[7]||'Islam').trim(),
              namaAyah: (c[8]||'-').trim(),
              namaIbu: (c[9]||'-').trim(),
              pekerjaanAyah: (c[10]||'-').trim(),
              pekerjaanIbu: (c[11]||'-').trim(),
              alamat: { jalan: (c[12]||'-').trim(), desa: (c[13]||'-').trim(), kecamatan: (c[14]||'-').trim(), kabupaten: (c[15]||'-').trim() }
            };
          });
          const merged = [...allStudents, ...newSiswa];
          setAllStudents(merged);
          syncToCloud('allStudents', merged, profil.tahunAjaran);
          setShowPaste(false); setPasteData('');
          showToast(`${newSiswa.length} siswa berhasil diimpor!`);
        } catch(e) { showToast('Format paste tidak sesuai.'); }
      };

      const [editStudent, setEditStudent] = useState(null);
      const [editForm, setEditForm] = useState({});
      const openEditSiswa = (s) => {
         setEditStudent(s);
         setEditForm({
            nama: s.nama || '', nisn: s.nisn || '', nis: s.nis || '',
            rombelSD: s.rombelSD || '', tempatTanggalLahir: s.tempatTanggalLahir || '',
            jenisKelamin: s.jenisKelamin || '', agama: s.agama || 'Islam',
            namaAyah: s.namaAyah || '', namaIbu: s.namaIbu || '',
            pekerjaanAyah: s.pekerjaanAyah || '', pekerjaanIbu: s.pekerjaanIbu || '',
            jalan: (s.alamat && s.alamat.jalan) || '',
            desa: (s.alamat && s.alamat.desa) || '',
            kecamatan: (s.alamat && s.alamat.kecamatan) || '',
            kabupaten: (s.alamat && s.alamat.kabupaten) || ''
         });
      };
      const saveEditSiswa = () => {
         if (!editStudent) return;
         const updated = allStudents.map(x => x.id === editStudent.id ? {
            ...x,
            nama: editForm.nama, nisn: editForm.nisn, nis: editForm.nis,
            rombelSD: editForm.rombelSD, tempatTanggalLahir: editForm.tempatTanggalLahir,
            jenisKelamin: editForm.jenisKelamin, agama: editForm.agama,
            namaAyah: editForm.namaAyah, namaIbu: editForm.namaIbu,
            pekerjaanAyah: editForm.pekerjaanAyah, pekerjaanIbu: editForm.pekerjaanIbu,
            alamat: { jalan: editForm.jalan, desa: editForm.desa, kecamatan: editForm.kecamatan, kabupaten: editForm.kabupaten }
         } : x);
         setAllStudents(updated);
         syncToCloud('allStudents', updated, profil.tahunAjaran);
         setEditStudent(null);
         showToast('Data siswa berhasil diperbarui!');
      };
      const deleteSiswa = (id) => {
         if (!window.confirm('Yakin ingin menghapus data siswa ini?')) return;
         const updated = allStudents.filter(x => x.id !== id);
         setAllStudents(updated);
         syncToCloud('allStudents', updated, profil.tahunAjaran);
         showToast('Data siswa berhasil dihapus.');
      };
      const deleteAllSiswa = () => {
         if (!window.confirm('PERINGATAN: Anda akan menghapus SELURUH data siswa. Lanjutkan?')) return;
         if (!window.confirm('Konfirmasi sekali lagi: hapus SEMUA siswa?')) return;
         setAllStudents([]);
         syncToCloud('allStudents', [], profil.tahunAjaran);
         showToast('Semua data siswa telah dihapus.');
      };

      const downloadTemplateSiswa = () => {
        downloadXLSXFile('template_siswa.xlsx', [
          ['No','Nama Siswa','NISN','NIS','Rombel SD','Tempat Tanggal Lahir','Jenis Kelamin','Agama','Nama Ayah','Nama Ibu','Pekerjaan Ayah','Pekerjaan Ibu','Dusun','Desa','Kecamatan','Kabupaten'],
          ['1','Contoh Ahmad','1234567890','001','1A','Jakarta, 1 Jan 2018','Laki-laki','Islam','Budi','Siti','Wiraswasta','IRT','Dusun A','Desa B','Kec C','Kab D']
        ], 'Template Siswa');
      };

      const handleSync = async () => {
        setLoading(true);
        try {
          const res = await fetch(csvUrl);
          if(!res.ok) throw new Error("Gagal mengambil data");
          
          const text = await res.text();
          const rows = parseCSV(text).filter(r => r && r.some(c => c.trim() !== ''));
          
          if (rows.length > 1) {
            const header = rows[0].map(h => h.trim().toUpperCase());
            const getCol = (hName) => header.findIndex(h => h === hName.toUpperCase() || h.includes(hName.toUpperCase()));
            
            const iNama = getCol('NAMA SISWA');
            const iNisn = getCol('NISN');
            const iNis = header.findIndex(h => h === 'NIS' || h.includes('NOMOR INDUK') || h.includes('NO INDUK') || h.includes('NO. INDUK'));
            const iRombel = getCol('ROMBEL SD');
            const iTempatLahir = getCol('TEMPAT TANGGAL LAHIR');
            const iJK = getCol('JENIS KELAMIN');
            const iNamaAyah = getCol('NAMA AYAH');
            const iNamaIbu = getCol('NAMA IBU');
            const iKerjaAyah = getCol('PEKERJAAN AYAH');
            const iKerjaIbu = getCol('PEKERJAAN IBU');
            const iDusun = getCol('DUSUN');
            const iDesa = getCol('DESA');
            const iKec = getCol('KECAMATAN');
            const iKab = getCol('KABUPATEN');
            const iAgama = getCol('AGAMA');

            const parsed = rows.slice(1).map((row, idx) => {
              const sName = iNama !== -1 ? row[iNama] : `Siswa ${idx+1}`;
              if (!sName || sName.trim() === '') return null;
              const nisnVal = iNisn !== -1 ? row[iNisn] : `00${idx}`;
              
              const existing = allStudents.find(old => old.nama === sName.trim() || old.nisn === nisnVal);
              const sId = existing ? existing.id : `S-${Date.now()}-${idx}`;

              return {
                id: sId,
                nama: sName.trim(),
                nisn: nisnVal,
                nis: iNis !== -1 ? row[iNis] : '-',
                rombelSD: iRombel !== -1 ? row[iRombel] : '-',
                tempatTanggalLahir: iTempatLahir !== -1 ? row[iTempatLahir] : '-',
                jenisKelamin: iJK !== -1 ? row[iJK] : '-',
                agama: iAgama !== -1 && row[iAgama] ? row[iAgama] : 'Islam',
                namaAyah: iNamaAyah !== -1 ? row[iNamaAyah] : '-',
                namaIbu: iNamaIbu !== -1 ? row[iNamaIbu] : '-',
                pekerjaanAyah: iKerjaAyah !== -1 ? row[iKerjaAyah] : '-',
                pekerjaanIbu: iKerjaIbu !== -1 ? row[iKerjaIbu] : '-',
                alamat: {
                  jalan: iDusun !== -1 ? row[iDusun] : '-',
                  desa: iDesa !== -1 ? row[iDesa] : '-',
                  kecamatan: iKec !== -1 ? row[iKec] : '-',
                  kabupaten: iKab !== -1 ? row[iKab] : '-',
                }
              };
            }).filter(s => s !== null); 
            
            if (parsed.length > 0) {
              setAllStudents(parsed);
              showToast(`Berhasil Sinkronisasi Master Data ${parsed.length} Siswa!`);
              syncToCloud('allStudents', parsed, profil.tahunAjaran);
            } else {
              throw new Error("Data kosong atau format salah");
            }
          }
        } catch (e) {
           console.error(e);
           showToast("Gagal menarik data. Pastikan link Google Sheets valid dan publik.");
        }
        setLoading(false);
      };
      
      return (
        <div className="bg-white/90 backdrop-blur-sm p-6 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm">
          <div className="w-12 h-12 sm:w-16 sm:h-16 bg-blue-50 text-blue-600 rounded-xl sm:rounded-2xl flex items-center justify-center mb-4 sm:mb-6"><RefreshCw className="text-xl sm:text-2xl"/></div>
          <h2 className="font-extrabold text-xl sm:text-2xl text-slate-800 mb-2">Sinkronisasi Database Induk Siswa</h2>
          <p className="text-slate-500 font-medium text-xs sm:text-sm mb-6 sm:mb-8">Data Master ditarik dari Spreadsheet. Nanti Guru Wali Kelas akan menarik datanya masing-masing berdasarkan Rombel SD.</p>
          
          <div className="flex flex-col md:flex-row gap-3 sm:gap-4 mb-8">
            <div className="flex-1 relative">
               <LinkIcon className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm" />
               <input type="text" className="w-full pl-10 pr-3 py-3 sm:py-4 bg-slate-50 border border-slate-200 rounded-xl sm:rounded-2xl text-xs sm:text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none" value={csvUrl} onChange={e=>setCsvUrl(e.target.value)} placeholder="https://docs.google.com/..." />
            </div>
            <button onClick={handleSync} disabled={loading} className="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 sm:px-8 py-3 sm:py-4 rounded-xl sm:rounded-2xl text-xs sm:text-sm font-bold shadow-md flex items-center justify-center gap-2 disabled:opacity-70 whitespace-nowrap">
              {loading ? <RefreshCw className="animate-spin" /> : <Download />}
              {loading ? 'Membaca Data...' : 'Sinkron & Simpan Master'}
            </button>
          </div>

          <div className="flex flex-wrap gap-2 mb-6">
            <button onClick={downloadTemplateSiswa} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md"><Download/> Download Template CSV</button>
            <button onClick={() => setShowPaste(!showPaste)} className="bg-primary hover:bg-primaryHover text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md"><Plus/> Import Paste Excel</button>
          </div>

          {showPaste && (
            <div className="bg-primaryLight/90 p-4 rounded-2xl border border-primary/20 mb-6">
              <p className="text-[10px] sm:text-xs font-bold text-primary/80 mb-3">Format kolom (tab-separated): No | Nama | NISN | NIS | Rombel | TTL | JK | Agama | Ayah | Ibu | Pek.Ayah | Pek.Ibu | Dusun | Desa | Kec | Kab</p>
              <textarea rows="5" className="w-full p-3 text-xs font-mono border border-primary/30 rounded-xl mb-3 outline-none focus:ring-2 focus:ring-primary" value={pasteData} onChange={e => setPasteData(e.target.value)} placeholder="1&#9;Ahmad&#9;1234567890&#9;001&#9;1A&#9;..." />
              <div className="flex gap-2">
                <button onClick={handlePasteSiswa} className="bg-primary hover:bg-primaryHover text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md">Simpan</button>
                <button onClick={() => setShowPaste(false)} className="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-xl text-xs font-bold">Batal</button>
              </div>
            </div>
          )}

          <div className="border border-slate-200 rounded-2xl overflow-hidden">
             <div className="bg-slate-50 p-4 border-b border-slate-200 font-bold text-slate-700 text-sm flex justify-between items-center">
                <span>Tinjauan Data Siswa ({allStudents.length})</span>
             </div>
             <div className="overflow-x-auto max-h-[50vh]" style={{scrollbarWidth: 'thin'}}>
               <table className="w-full text-left text-[10px] sm:text-sm min-w-[820px] break-words">
                 <thead className="bg-slate-100 text-slate-600 sticky top-0 shadow-sm">
                    <tr>
                      <th className="p-2 sm:p-3 w-12 text-center border-r border-slate-200">No</th>
                      <th className="p-2 sm:p-3 border-r border-slate-200">NISN</th>
                      <th className="p-2 sm:p-3 border-r border-slate-200">NIS</th>
                      <th className="p-2 sm:p-3 border-r border-slate-200 whitespace-nowrap">Nama Siswa</th>
                      <th className="p-2 sm:p-3 text-center border-r border-slate-200">Kelas</th>
                      <th className="p-2 sm:p-3 border-r border-slate-200">Wali Kelas</th>
                      <th className="p-2 sm:p-3 text-center w-[110px]">Aksi</th>
                    </tr>
                 </thead>
                 <tbody className="divide-y divide-slate-100 bg-white">
                    {allStudents.map((s, i) => {
                       const w = teachers.find(t => t.waliKelas === s.rombelSD);
                       return (
                         <tr key={s.id} className="hover:bg-blue-50/30">
                           <td className="p-2 sm:p-3 text-center text-slate-400 font-bold border-r border-slate-100">{i+1}</td>
                           <td className="p-2 sm:p-3 text-slate-600 border-r border-slate-100">{s.nisn}</td>
                           <td className="p-2 sm:p-3 text-slate-600 border-r border-slate-100">{s.nis}</td>
                           <td className="p-2 sm:p-3 font-bold text-slate-800 border-r border-slate-100 whitespace-nowrap">{s.nama}</td>
                           <td className="p-2 sm:p-3 text-center border-r border-slate-100"><span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">{s.rombelSD}</span></td>
                           <td className="p-2 sm:p-3 text-slate-600 text-xs border-r border-slate-100">{w ? w.nama : '-'}</td>
                           <td className="p-2 sm:p-3 text-center">
                              <div className="flex items-center justify-center gap-1">
                                 <button onClick={() => openEditSiswa(s)} title="Edit" className="text-blue-600 hover:text-blue-800 hover:bg-blue-50 p-1.5 rounded-lg"><Edit/></button>
                                 <button onClick={() => deleteSiswa(s.id)} title="Hapus" className="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-lg"><Trash2/></button>
                              </div>
                           </td>

                       )
                    })}
                    {allStudents.length === 0 && <tr><td colSpan="7" className="p-8 text-center font-bold text-slate-400">Data belum disinkronisasi.</td></tr>}
                 </tbody>
               </table>
             </div>
             {allStudents.length > 0 && (
               <div className="p-3 border-t border-slate-200 bg-slate-50 flex justify-end">
                  <button onClick={deleteAllSiswa} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md"><Trash2/> Hapus Semua Siswa</button>
               </div>
             )}
          </div>

          {editStudent && (
            <div className="fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 sm:p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                 <h3 className="font-extrabold text-lg text-slate-800 mb-4">Edit Data Siswa</h3>
                 <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                    {[
                      ['nama','Nama Lengkap'],['nisn','NISN'],['nis','NIS'],['rombelSD','Kelas/Rombel (cth: 4A)'],
                      ['tempatTanggalLahir','Tempat, Tanggal Lahir'],['jenisKelamin','Jenis Kelamin'],['agama','Agama'],
                      ['namaAyah','Nama Ayah'],['namaIbu','Nama Ibu'],['pekerjaanAyah','Pekerjaan Ayah'],['pekerjaanIbu','Pekerjaan Ibu'],
                      ['jalan','Dusun/Jalan'],['desa','Desa'],['kecamatan','Kecamatan'],['kabupaten','Kabupaten']
                    ].map(([k,lbl]) => (
                       <label key={k} className="flex flex-col gap-1">

                          <input className="p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-primary" value={editForm[k] || ''} onChange={e => setEditForm({...editForm, [k]: e.target.value})} />
                       </label>

                    <button onClick={saveEditSiswa} className="px-5 py-2 rounded-xl bg-primary hover:bg-primaryHover text-white font-bold shadow-md">Simpan Perubahan</button>

              </div>
            </div>

        </div>
      );
